# ==============================================================================
# Ytal Tech Solutions & Services LLP - Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Target: /etc/nginx/sites-available/ytaltech.conf
# Enable: ln -s /etc/nginx/sites-available/ytaltech.conf /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx
# ==============================================================================

# Upstream WSGI application (Gunicorn / Waitress)
upstream ytaltech_app {
    server 127.0.0.1:5000 fail_timeout=0;
    keepalive 32;
}

# 1. HTTP Server - Strict Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name elearning.ytaltech.com www.elearning.ytaltech.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elearning.ytaltech.com www.elearning.ytaltech.com;

    # SSL Certificates (configure paths for Let's Encrypt or commercial SSL)
    ssl_certificate /etc/letsencrypt/live/elearning.ytaltech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elearning.ytaltech.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Request limits (allow up to 15MB for payment receipts and presentation materials)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Gzip Compression for High-Throughput Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Direct Static Asset Serving with Aggressive 30-Day Browser Caching
    # Adjust alias path to your production deployment directory:
    location /static/ {
        alias /var/www/ytaltechwebsite/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri @wsgi_proxy;
    }

    # Pass all dynamic application requests to Gunicorn WSGI backend
    location / {
        try_files $uri @wsgi_proxy;
    }

    location @wsgi_proxy {
        proxy_pass http://ytaltech_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard Proxy Headers for Real IP and SSL detection
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
