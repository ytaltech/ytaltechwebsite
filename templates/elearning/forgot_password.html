{% extends 'elearning/base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="meta-tag" style="background:#fef3c7;color:#92400e;font-weight:700;">Account Recovery</span>
            <h2 style="margin-top: 10px;">Reset Your Password</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">
                Enter your registered email address and we will send you a secure password reset link.
            </p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
                Send Password Reset Link ➔
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem;">
            <a href="{{ url_for('auth.login') }}" style="color:var(--text-muted);text-decoration:none;">
                ← Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
